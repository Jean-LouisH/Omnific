Entity:
  name: "DemoUtilityScripts"
  ScriptCollection:
    Python: ["escape_to_selection_menu.py", "reload_active_scene.py"]
Entity:
  name: "Audio Player"
  AudioSource:
    play_infinitely: false
  AudioListener: "default"
  ScriptCollection:
    Python: ["apps/audio_player/scripts/python/audio_player.py"]
Entity:
  name: "Oscilloscope"
  GUI:
    PlotCanvas: 
      pivot: "centre"
      anchor_pivot: "centre"
Entity:
  name: "Playback Time"
  GUI:
    Label: 
      text: "00:00"
      font: ["tests/fonts/Lato-Regular.ttf", 20]
      text_colour: "#FFFFFFFF"
      position: [1.0, 0.0]
      pivot: "bottom_left"
      anchor_pivot: "bottom_left"
      margin: [10.0, 10.0]
Entity:
  name: "Playback Length"
  GUI:
    Label: 
      text: "00:00"
      font: ["tests/fonts/Lato-Regular.ttf", 20]
      text_colour: "#FFFFFFFF"
      position: [1.0, 0.0]
      pivot: "bottom_right"
      anchor_pivot: "bottom_right"
      margin: [-10.0, 10.0]
Entity:
  name: "Camera"
  Camera: "default"