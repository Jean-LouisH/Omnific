Entity:
  name: "DemoUtilityScripts"
  ScriptCollection:
    Python: ["escape_to_selection_menu.py", "reload_active_scene.py"]
Entity:
  name: "Audio Player"
  AudioSource:
    play_infinitely: false
  AudioListener: "default"
  ScriptCollection:
    Python: ["apps/audio_player/scripts/python/audio_player.py"]
Entity:
  name: "Start Message"
  GUI:
    Label: 
      text: "Drop a .ogg or .wav file onto the window to play it"
      font: ["tests/fonts/Lato-Regular.ttf", 20]
      text_colour: "#FFFFFFFF"
      pivot: "centre"
      anchor_pivot: "centre"
Entity:
  name: "Oscilloscope"
  GUI:
    PlotCanvas: 
      pivot: "centre"
      anchor_pivot: "centre"
Entity:
  name: "Previous Button"
  GUI:
    Button:
      text: "Previous"
      font: ["tests/fonts/Lato-Regular.ttf", 20]
      text_colour: "#000000FF"
      pivot: "bottom_right"
      anchor_pivot: "bottom_centre"
      margin: [-75.0, 5.0]
Entity:
  name: "Play/Pause Button"
  GUI:
    Button:
      text: "Play/Pause"
      font: ["tests/fonts/Lato-Regular.ttf", 20]
      text_colour: "#000000FF"
      pivot: "bottom_centre"
      anchor_pivot: "bottom_centre"
      margin: [0.0, 5.0]
Entity:
  name: "Next Button"
  GUI:
    Button:
      text: "Next"
      font: ["tests/fonts/Lato-Regular.ttf", 20]
      text_colour: "#000000FF"
      pivot: "bottom_left"
      anchor_pivot: "bottom_centre"
      margin: [75.0, 5.0]
Entity:
  name: "Playback Time"
  GUI:
    Label: 
      text: "00:00"
      font: ["tests/fonts/Lato-Regular.ttf", 20]
      text_colour: "#FFFFFFFF"
      position: [1.0, 0.0]
      pivot: "bottom_left"
      anchor_pivot: "bottom_left"
      margin: [10.0, 10.0]
Entity:
  name: "Playback Length"
  GUI:
    Label: 
      text: "00:00"
      font: ["tests/fonts/Lato-Regular.ttf", 20]
      text_colour: "#FFFFFFFF"
      position: [1.0, 0.0]
      pivot: "bottom_right"
      anchor_pivot: "bottom_right"
      margin: [-10.0, 10.0]
Entity:
  name: "Camera"
  Camera: "default"