# Components Demonstration

Entity:
  name: "GlobalShaderEntity"
  Renderable:
    overriding_shader:
      preset: "Shader::UNLIT"
Entity:
  name: "Renderable1"
  parent: "GlobalShaderEntity"
  transform:
    translation: [0.0, 0.0, 0.0]
  ScriptCollection:
    Python: ["scenes/tests/z_rotation.py"]
  Renderable:
    mesh: "Mesh::CUBE"
    material:
      albedo: "Image::#FF0000"
Entity:
  name: "Renderable2"
  parent: "Renderable1"
  transform:
    translation: [0.0, -1.2, 0.0]
  Renderable:
    mesh: "Mesh::CUBE"
    material:
      albedo: "Image::#FFFFFF"
  ScriptCollection:
    Python: ["scenes/tests/x_vibration.py"]
Entity:
  name: "Camera"
  transform:
    translation: [0, 0, 5]
  Camera: default
  ScriptCollection:
    Python: ["scenes/tests/camera_control.py"]
Entity:
  name: "DemoUtilityScripts"
  ScriptCollection:
    CPP: ["EscapeToSelectionMenu", "ReloadActiveScene"]