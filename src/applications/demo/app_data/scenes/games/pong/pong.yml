# Omnific Pong

Entity:
  name: "GlobalShaderEntity"
  transform: default
  Renderable:
    overriding_shader:
      preset: "Shader::UNLIT"
Entity:
  name: "Instructions"
  Label: 
    text: "Controls: 'W' - Up, 'S' - Down                   'P' - Toggle AI/P2"
    font: ["fonts/Lato-Regular.ttf", 16]
    text_colour: "#FFFFFFFF"
    pivot: "top_left"
    anchor_pivot: "top_left"
    margin: [20.0, -20.0]
Entity:
  name: "MessageBoard"
  Label: 
    text: "Loading..."
    font: ["fonts/Lato-Regular.ttf", 32]
    text_colour: "#FFFFFFFF"
    pivot: "centre"
    anchor_pivot: "centre"
Entity:
  name: "Camera"
  transform:
    translation: [0, 0, 30]
  Camera: "default"
  AudioListener: "default"
  # ScriptCollection:
  #   Python: ["scenes/games/pong/camera_shake.py"]
Entity:
  name: "Game Mechanics"
  ScriptCollection:
    Python: ["scenes/games/pong/pong.py"]
  AudioSource:
    audio: ["audio/nature.ogg"]
    play_infinitely: true
Entity:
  name: "Paddle1"
  parent: "GlobalShaderEntity"
  transform:
    translation: [-17, 0, 0]
    scale: [1, 5, 1]
  PhysicsBody:
    has_gravity: false
    collision_response_type: "rigid"
  Renderable:
    mesh: "Mesh::CUBE"
    material:
      albedo: "Image::#FF0000"
  ScriptCollection:
    Python: ["scenes/games/pong/player_control.py"]
  Collider: default
Entity:
  name: "ScoreCount1"
  parent: "Paddle1"
  Label: 
    text: "a"
    font: ["fonts/Lato-Regular.ttf", 32]
    text_colour: "#FF0000FF"
    pivot: "bottom_centre"
    follow_target_entity_name: "Paddle1"
    follow_offset: [0.0, 50.0]
  ScriptCollection:
    Python: ["scenes/games/pong/player_score.py"]
Entity:
  name: "Paddle2"
  parent: "GlobalShaderEntity"
  transform:
    translation: [17, 0, 0]
    scale: [1, 5, 1]
  PhysicsBody:
    has_gravity: false
    collision_response_type: "rigid"
  Renderable:
    mesh: "Mesh::CUBE"
    material:
      albedo: "Image::#0000FF"
  ScriptCollection:
    Python: ["scenes/games/pong/ai_control.py"]
  Collider: default
Entity:
  name: "ScoreCount2"
  parent: "Paddle2"
  Label: 
    text: "b"
    font: ["fonts/Lato-Regular.ttf", 32]
    text_colour: "#0000FFFF"
    pivot: "bottom_centre"
    follow_target_entity_name: "Paddle2"
    follow_offset: [0.0, 50.0]
  ScriptCollection:
    Python: ["scenes/games/pong/ai_score.py"]
Entity:
  name: "Ball"
  parent: "GlobalShaderEntity"
  transform:
    translation: [0, 10, 0]
  Renderable:
    mesh: "Mesh::CUBE"
    material:
      albedo: "Image::#FFFFFF"
  PhysicsBody:
    has_gravity: false
    collision_response_type: "intangible"
  Collider:
    is_trigger_only: true
  AudioSource:
    audio: ["audio/click.ogg"]
  ScriptCollection:
    Python: ["scenes/games/pong/ball_collision_sounds.py"]
Entity:
  name: "UpperBoundary"
  parent: "GlobalShaderEntity"
  transform:
    translation: [0, 12, 0]
    scale: [50, 1, 1]
  Collider: default
  Renderable:
    mesh: "Mesh::CUBE"
    material:
      albedo: "Image::#FFFFFF"
  PhysicsBody:
    has_gravity: false
    collision_response_type: "kinematic"
Entity:
  name: "LowerBoundary"
  parent: "GlobalShaderEntity"
  transform:
    translation: [0, -12, 0]
    scale: [50, 1, 1]
  Collider: default
  Renderable:
    mesh: "Mesh::CUBE"
    material:
      albedo: "Image::#FFFFFF"
  PhysicsBody:
    has_gravity: false
    collision_response_type: "kinematic"
Entity:
  name: "LeftGoalPost"
  parent: "GlobalShaderEntity"
  transform:
    translation: [-22, 0, 0]
    scale: [1, 50, 1]
Entity:
  name: "RightGoalPost"
  parent: "GlobalShaderEntity"
  transform:
    translation: [22, 0, 0]
    scale: [1, 50, 1]
Entity:
  name: "Light"
  transform:
    rotation: [0.0, 0.0, 0.0]
  Light:
    intensity: 10.0
    colour: "#FFFFFF"
    light_mode: "directional"
Entity:
  name: "DemoUtilityScripts"
  ScriptCollection:
    CPP: ["EscapeToSelectionMenu", "ReloadActiveScene"]
